name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          for i in 1 2 3; do
            "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0" && break
            echo "SDK retry $i"; sleep 5
          done || true

      - name: Detect Gradle version
        id: gv
        run: |
          GV=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            GV=$(sed -n 's/.*gradle-\([0-9][0-9.]*[0-9]\)-\(bin\|all\)\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -1)
          fi
          [ -n "$GV" ] || GV="9.3.1"
          echo "version=$GV" >> "$GITHUB_OUTPUT"
          echo "Gradle: $GV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Prepare .env and keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "=================== ERROR SUMMARY ==================="
            grep -n -A25 "What went wrong" build.log | head -70
            echo "---------------- compile errors ----------------"
            grep -n -E "^e: |error:" build.log | head -30
            echo "---------------- last lines ----------------"
            tail -30 build.log
            exit $CODE
          fi
          tail -5 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Forge-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload full build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
